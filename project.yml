name: RationRhythm
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: 'YES'
    DEVELOPMENT_LANGUAGE: en
targets:
  RationRhythm:
    type: application
    platform: iOS
    sources:
    - Phone
    - Common
    - SharedCatalog
    entitlements:
      path: Phone/RationRhythm.entitlements
      properties:
        com.apple.security.application-groups:
        - group.app.rationrhythm.journal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rationrhythm.journal
        INFOPLIST_KEY_CFBundleDisplayName: PockeMoon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: 'NO'
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the barcode on a package to look up its food label.
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: 1,2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
    - target: RationRhythmWidget
      embed: true
    - target: RationRhythmWatch
      embed: true
  RationRhythmWidget:
    type: app-extension
    platform: iOS
    sources:
    - Widget
    - Common
    entitlements:
      path: Widget/RationRhythmWidget.entitlements
      properties:
        com.apple.security.application-groups:
        - group.app.rationrhythm.journal
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: PockeMoon
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rationrhythm.journal.widget
        TARGETED_DEVICE_FAMILY: 1,2
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        SKIP_INSTALL: 'YES'
  RationRhythmWatch:
    type: application
    platform: watchOS
    sources:
    - Watch
    - Common
    - path: RationRhythmWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rationrhythm.journal.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: PockeMoon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: 'NO'
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.rationrhythm.journal
        INFOPLIST_KEY_WKApplication: 'YES'
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: 'YES'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
  RationRhythmUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - path: UITests
    - path: SharedCatalog/OfflineProducts.json
    dependencies:
    - target: RationRhythm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rationrhythm.journal.uitests
        TEST_TARGET_NAME: RationRhythm
schemes:
  RationRhythm:
    build:
      targets:
        RationRhythm: all
    test:
      targets:
      - RationRhythmUITests
  RationRhythmWatch:
    build:
      targets:
        RationRhythmWatch: all
